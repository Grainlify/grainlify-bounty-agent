# Local Postgres for development and tests. Not used in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent-local-only
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
